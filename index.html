<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hélio Garcia - Assessoria Acadêmica</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0b1a30;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 820px;
      text-align: center;
    }

    .headline {
      font-size: 1.8rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }

    .headline span {
      color: #27ae60;
    }

    .subheadline {
      font-size: 1.05rem;
      color: #cbd5e1;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    /* Container do Vídeo 16:9 Responsivo */
    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* Proporção 16:9 */
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      background-color: #000;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Botão de Ação / WhatsApp */
    .cta-container {
      margin-top: 32px;
    }

    .cta-button {
      display: inline-block;
      background-color: #27ae60;
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 700;
      text-decoration: none;
      padding: 18px 36px;
      border-radius: 8px;
      transition: background-color 0.2s ease, transform 0.2s ease;
      box-shadow: 0 8px 20px rgba(39, 174, 96, 0.35);
    }

    .cta-button:hover {
      background-color: #219653;
      transform: translateY(-2px);
    }

    .security-note {
      margin-top: 14px;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    @media (max-width: 600px) {
      .headline {
        font-size: 1.35rem;
      }
      .subheadline {
        font-size: 0.95rem;
      }
      .cta-button {
        width: 100%;
        padding: 16px 20px;
        font-size: 1.05rem;
      }
    }
  </style>
</head>
<body>

  <main class="container">
    <h1 class="headline">Você bateu no teto da sua carreira por falta de <span>diploma</span>?</h1>
    <p class="subheadline">Assista ao vídeo abaixo e veja como resolver 100% da burocracia acadêmica.</p>

    <!-- Player de Vídeo Responsivo -->
    <div class="video-wrapper">
      <iframe 
        src="https://www.youtube.com/embed/m9vzqY-zNuQ?rel=0&modestbranding=1" 
        title="Hélio Garcia - VSL" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        allowfullscreen>
      </iframe>
    </div>

    <!-- Chamada para Ação -->
    <div class="cta-container">
      <a href="https://wa.me/5561999402466?text=Ol%C3%A1%2C%20assisti%20ao%20v%C3%ADdeo%20e%20gostaria%20de%20falar%20com%20um%20consultor%20para%20tirar%20as%20minhas%20d%C3%BAvidas." target="_blank" rel="noopener noreferrer" class="cta-button">
        FALAR COM UM CONSULTOR AGORA
      </a>
      <p class="security-note">🔒 Atendimento individual e confidencial</p>
    </div>
  </main>

</body>
