<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diplomas & Certificados Académicos</title>
    <!-- Fonte elegante (Cinzel para títulos acadêmicos e Inter para leitura) -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0b132b;
            color: #f8fafc;
            line-height: 1.6;
        }

        /* Topo / Navegação */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background-color: #1c2541;
            border-bottom: 2px solid #c5a059; /* Tom dourado */
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: #c5a059;
            letter-spacing: 1px;
        }

        nav a {
            color: #e2e8f0;
            text-decoration: none;
            margin-left: 25px;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #c5a059;
        }

        /* Banner Principal (Hero) */
        .hero {
            min-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 140px 8% 60px;
            background: linear-gradient(135deg, #0b132b 0%, #1c2541 100%);
            gap: 40px;
        }

        .hero-text {
            flex: 1;
        }

        .hero-text h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.8rem;
            color: #ffffff;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .hero-text h1 span {
            color: #c5a059;
        }

        .hero-text p {
            font-size: 1.15rem;
            color: #cbd5e1;
            margin-bottom: 30px;
            max-width: 550px;
        }

        .btn {
            display: inline-block;
            padding: 14px 32px;
            background-color: #c5a059;
            color: #0b132b;
            font-weight: 600;
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(197, 160, 89, 0.3);
        }

        .btn:hover {
            background-color: #e0b86c;
            transform: translateY(-2px);
        }

        .hero-image {
            flex: 1;
            text-align: center;
        }

        .hero-image img {
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            border: 2px solid #c5a059;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
